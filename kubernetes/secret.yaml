
# Definition:
# A Secret stores sensitive configuration data separately
# from application code and Docker images.

# Kubernetes API version
apiVersion: v1

# Resource type
kind: Secret

metadata:
  name: iris-ml-secret
  namespace: ml-app

# Secret data format
type: Opaque

# Sensitive key-value pairs
# Values below are Base64-encoded examples, NOT real credentials.
data:
  DB_USERNAME: "bW9uZ29fdXNlcg=="
  DB_PASSWORD: "ZXhhbXBsZV9wYXNzd29yZA=="
